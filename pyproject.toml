[project]
name = "fcst-manager"
version = "0.1.0"
description = "Forecast-Automatisierung für Artikel aus ÖBB-Rahmenverträgen"
readme = "README.md"
authors = [
    { name = "Bennet Freigang", email = "bennetfreigang@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
]

[project.scripts]
fcst-manager = "fcst_manager:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
